name: Build Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.*[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.0.2). Leave empty to use the pushing tag or default."
        type: "string"
        required: false

permissions:
  contents: write

env:
  # When triggered by a tag push, ${{ github.ref_name }} is the tag (e.g. v0.0.2).
  # When triggered by branch push or workflow_dispatch without input, fall back to v0.0.1.
  VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.1' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: linux-amd64
            pkg: deb
          - goos: linux
            goarch: arm64
            name: linux-arm64
            pkg: deb
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            pkg: zip
          - goos: windows
            goarch: amd64
            name: windows-amd64
            pkg: zip
            ext: .exe
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26'

      - name: Build tailscale & tailscaled
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION_SHORT: ${{ env.VERSION }}
          VERSION_LONG: ${{ env.VERSION }}
          VERSION_GIT_HASH: ${{ env.VERSION }}
        run: |
          ./build_dist.sh tailscale.com/cmd/tailscale
          if [ -n "${{ matrix.ext }}" ]; then mv tailscale tailscale${{ matrix.ext }}; fi
          ./build_dist.sh tailscale.com/cmd/tailscaled
          if [ -n "${{ matrix.ext }}" ]; then mv tailscaled tailscaled${{ matrix.ext }}; fi

      - name: Package .deb (Linux)
        if: matrix.pkg == 'deb'
        run: |
          mkdir -p tailscale-deb/DEBIAN
          mkdir -p tailscale-deb/usr/bin
          mkdir -p tailscale-deb/lib/systemd/system
          cat > tailscale-deb/DEBIAN/control << 'EOF'
          Package: tailscale
          Version: ${{ env.VERSION }}
          Section: net
          Priority: optional
          Architecture: ${{ matrix.goarch }}
          Maintainer: Tailscale Inc <support@tailscale.com>
          Description: Tailscale VPN daemon and CLI
           Tailscale is a zero config VPN for building secure networks.
           It installs on any device in minutes, manages firewall rules for you,
           and works from anywhere.
          Depends: iptables, iproute2
          EOF
          cp tailscale tailscale-deb/usr/bin/
          cp tailscaled tailscale-deb/usr/bin/
          cp cmd/tailscaled/tailscaled.service tailscale-deb/lib/systemd/system/
          dpkg-deb --build tailscale-deb tailscale_${{ env.VERSION }}_${{ matrix.name }}.deb

      - name: Package .zip (macOS/Windows)
        if: matrix.pkg == 'zip'
        run: |
          mkdir -p tailscale-zip
          cp tailscale${{ matrix.ext }} tailscale-zip/
          cp tailscaled${{ matrix.ext }} tailscale-zip/
          zip -j tailscale_${{ env.VERSION }}_${{ matrix.name }}.zip tailscale-zip/*

      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-${{ matrix.name }}
          path: |
            tailscale${{ matrix.ext }}
            tailscaled${{ matrix.ext }}
            tailscale_${{ env.VERSION }}_${{ matrix.name }}.*
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
