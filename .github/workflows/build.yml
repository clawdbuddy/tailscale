name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: 386
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@0a12d6a0d2e0b89a7605d21b5b0f4f32c4df7d21 # v5.5.0
        with:
          go-version: '1.26'

      - name: Build tailscale & tailscaled
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ./build_dist.sh tailscale.com/cmd/tailscale
          ./build_dist.sh tailscale.com/cmd/tailscaled

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            tailscale
            tailscaled
          retention-days: 7