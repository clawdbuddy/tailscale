name: Tailscale Linux amd64

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  VERSION: ${{ github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26'

      - name: Build tailscale & tailscaled
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
          VERSION_SHORT: ${{ env.VERSION }}
          VERSION_LONG: ${{ env.VERSION }}
          VERSION_GIT_HASH: ${{ env.VERSION }}
        run: |
          ./build_dist.sh tailscale.com/cmd/tailscale
          ./build_dist.sh tailscale.com/cmd/tailscaled

      - name: Build .deb package
        run: |
          mkdir -p tailscale-deb/DEBIAN
          mkdir -p tailscale-deb/usr/bin
          mkdir -p tailscale-deb/lib/systemd/system
          cat > tailscale-deb/DEBIAN/control << 'EOF'
          Package: tailscale
          Version: ${{ env.VERSION }}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Tailscale Inc <support@tailscale.com>
          Description: Tailscale VPN daemon and CLI
           Tailscale is a zero config VPN for building secure networks.
           It installs on any device in minutes, manages firewall rules for you,
           and works from anywhere.
          Depends: iptables, iproute2
          EOF
          cp tailscale tailscale-deb/usr/bin/
          cp tailscaled tailscale-deb/usr/bin/
          cp cmd/tailscaled/tailscaled.service tailscale-deb/lib/systemd/system/
          dpkg-deb --build tailscale-deb tailscale_${{ env.VERSION }}_amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-linux-amd64
          path: |
            tailscale
            tailscaled
            tailscale_${{ env.VERSION }}_amd64.deb
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ github.run_id }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}