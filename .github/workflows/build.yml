name: Build

on:
  push:
    branches:
      - main

env:
  VERSION: ${{ github.sha }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: 386
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26'

      - name: Build tailscale & tailscaled
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION_SHORT: ${{ env.VERSION }}
          VERSION_LONG: ${{ env.VERSION }}
          VERSION_GIT_HASH: ${{ env.VERSION }}
        run: |
          ./build_dist.sh tailscale.com/cmd/tailscale
          ./build_dist.sh tailscale.com/cmd/tailscaled

      - name: Rename for upload
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          mv tailscale${EXT} tailscale-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}
          mv tailscaled${EXT} tailscaled-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}

      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            tailscale-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.sha }}
          release_name: Tailscale ${{ github.sha }}
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}